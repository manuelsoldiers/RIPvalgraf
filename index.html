<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RIPValGraf — Sistema Val.Graf.</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <!-- ===================== SCHERMATA: MENU PRINCIPALE (LOGIN) ===================== -->
    <section id="screen-login" class="screen active">
      <h1 class="app-title">
        <span>ADI Latina</span>
        <span>Sistema Val.Graf.</span>
      </h1>

      <div class="login-card">
        <!-- Intestazione con logo -->
        <header class="login-header">
          <p class="ssr-label">SISTEMA SANITARIO REGIONALE</p>

          <div class="brand">
            <!-- Croce ASL (invariata): quadrato rosso + quadrato blu sovrapposti -->
            <svg class="cross-logo" viewBox="0 0 70 70" aria-hidden="true">
              <rect x="4"  y="24" width="42" height="42" fill="#e2231a" />
              <rect x="24" y="4"  width="42" height="42" fill="#2e2e8f" />
            </svg>

            <!-- "ASL Latina" sostituito con "RIPValGraf" + lapide -->
            <div class="brand-text">
              <span class="brand-name">RIPValGraf</span>
              <div class="tomb">
                <!-- Simbolo lapide/tomba con data -->
                <svg class="tomb-icon" viewBox="0 0 64 72" aria-hidden="true">
                  <!-- terreno -->
                  <rect x="2" y="60" width="60" height="8" rx="3" fill="#8a9a5b" />
                  <!-- lapide -->
                  <path d="M14 62 V30 a18 18 0 0 1 36 0 V62 Z" fill="#9aa3ad" stroke="#6c757d" stroke-width="2" />
                  <!-- croce incisa -->
                  <rect x="30" y="18" width="4" height="18" fill="#5a6472" />
                  <rect x="24" y="24" width="16" height="4" fill="#5a6472" />
                </svg>
                <span class="tomb-date">01/07/2026</span>
              </div>
            </div>
          </div>
        </header>

        <!-- Corpo del form -->
        <div class="login-body">
          <p class="login-hint">Accedi per iniziare la tua sessione di lavoro</p>

          <form id="login-form" autocomplete="off">
            <!-- Username: campo MODIFICABILE (nome utente della sessione / leaderboard) -->
            <div class="field">
              <input
                type="text"
                id="username"
                name="username"
                class="field-input"
                placeholder="nome.utente"
                maxlength="24"
                autocomplete="off"
                required
              />
              <span class="field-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18">
                  <circle cx="12" cy="8" r="4" fill="none" stroke="#6c757d" stroke-width="1.6"/>
                  <path d="M4 20c0-4 4-6 8-6s8 2 8 6" fill="none" stroke="#6c757d" stroke-width="1.6"/>
                </svg>
              </span>
            </div>

            <!-- Password: campo FISSO e NON modificabile ("01_07_2026") -->
            <div class="field">
              <input
                type="password"
                id="password"
                name="password"
                class="field-input"
                value="01_07_2026"
                readonly
                tabindex="-1"
              />
              <button type="button" id="toggle-password" class="field-icon field-icon-btn" aria-label="Mostra password">
                <svg viewBox="0 0 24 24" width="18" height="18">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" fill="none" stroke="#6c757d" stroke-width="1.6"/>
                  <circle cx="12" cy="12" r="3" fill="none" stroke="#6c757d" stroke-width="1.6"/>
                </svg>
              </button>
            </div>

            <div class="login-actions">
              <button type="submit" id="accedi-btn" class="btn-accedi">Accedi</button>
            </div>
          </form>

          <a href="#" class="forgot-link">Ho dimenticato la password</a>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
